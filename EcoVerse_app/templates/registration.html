{% extends "base.html" %}

{% block extra_css %}
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    background: radial-gradient(circle at 50% -20%, var(--primary-soft), var(--bg-color) 80%);
  }

  .auth-container {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 2.5rem 2rem;
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
  }

  .auth-logo {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-glow));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin: 0 auto 1.5rem;
    box-shadow: var(--shadow-glow);
  }

  .auth-theme-toggle {
    position: absolute;
    top: 1rem;
    right: 1rem;
  }
</style>
{% endblock %}

{% block body_content %}
<div class="auth-container fade-in">
  <button class="btn-icon auth-theme-toggle theme-toggle-btn" aria-label="Toggle theme">
    <i class="fa-solid fa-circle-half-stroke"></i>
  </button>
  
  <div class="auth-logo"><i class="fa-solid fa-leaf"></i></div>
  <h1 class="text-center mb-1">Join EcoVerse</h1>
  <p class="text-center muted mb-4">Start your journey to a greener tomorrow</p>

  <form method="POST" action="{% url 'registration' %}">
    {% csrf_token %}

    <div class="form-group">
      <label class="form-label" for="fullName">Full Name</label>
      <input class="form-control" id="fullName" name="full_name" type="text" placeholder="Enter your full name" required />
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" name="email" type="email" placeholder="your.email@example.com" required />
    </div>

    <div class="form-group">
      <label class="form-label" for="phone">Phone Number</label>
      <input class="form-control" id="phone" name="phone" type="tel" placeholder="+1 (555) 123-4567" required />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" placeholder="Create a strong password" required />
    </div>

    <div class="form-group">
      <label class="form-label" for="confirmPassword">Confirm Password</label>
      <input class="form-control" id="confirmPassword" name="confirm_password" type="password" placeholder="Re-enter your password" required />
    </div>

    <button class="btn btn-primary btn-block mt-3" type="submit">
      Join EcoVerse <i class="fa-solid fa-leaf" style="margin-left: 0.5rem;"></i>
    </button>
  </form>

  <p class="text-center muted mt-4" style="font-size: 0.9rem;">
    Already have an account? <a href="/signin" class="text-primary font-semibold">Sign In</a>
  </p>
</div>
{% endblock %}
