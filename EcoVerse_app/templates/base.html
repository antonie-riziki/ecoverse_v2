{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="{% if request.COOKIES.theme %}{{ request.COOKIES.theme }}{% else %}light{% endif %}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}EcoVerse{% endblock %}</title>
  <meta name="description" content="EcoVerse: Turning waste into energy." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% if messages %}
    <div class="messages-container" style="position: fixed; top: 1rem; right: 1rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; max-width: 320px;">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" style="padding: 1rem; border-radius: var(--radius-md); background: var(--card-bg); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: space-between; gap: 1rem; animation: slideIn 0.3s ease forwards;">
          <span style="font-size: 0.9rem; font-weight: 500;">{{ message }}</span>
          <button onclick="this.parentElement.remove()" style="background: none; border: none; cursor: pointer; color: var(--text-muted);"><i class="fas fa-times"></i></button>
        </div>
      {% endfor %}
    </div>
    <style>
      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      .alert.success { border-left: 4px solid var(--success); }
      .alert.error { border-left: 4px solid var(--danger); }
      .alert.warning { border-left: 4px solid var(--warning); }
      .alert.info { border-left: 4px solid var(--primary); }
    </style>
  {% endif %}

  {% block body_content %}
  {% endblock %}

  <script>
    // Theme toggling logic
    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      document.cookie = `theme=${newTheme};path=/;max-age=31536000`; // 1 year
    }

    const themeBtns = document.querySelectorAll('.theme-toggle-btn');
    themeBtns.forEach(btn => btn.addEventListener('click', toggleTheme));
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
