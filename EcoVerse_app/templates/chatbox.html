{% load static %}
<style>
/* Chatbot Component CSS */
.chatbot-container {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 1000;
}

.chatbot-trigger {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-glow));
    color: white;
    border: none;
    cursor: pointer;
    font-size: 24px;
    box-shadow: var(--shadow-md);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chatbot-trigger:hover {
    transform: scale(1.05);
    box-shadow: var(--shadow-lg);
}

.chatbot-window {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 350px;
    height: 500px;
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border-color);
    display: none;
    flex-direction: column;
    overflow: hidden;
}

.chatbot-window.show {
    display: flex;
    animation: slideUp 0.3s ease forwards;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.chatbot-header {
    background: linear-gradient(135deg, var(--primary), var(--primary-glow));
    color: white;
    padding: 1rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chatbot-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.chatbot-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
}

.chatbot-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.chatbot-name {
    font-weight: 700;
    font-family: var(--font-heading);
    line-height: 1.2;
}

.chatbot-subtitle {
    font-size: 0.8rem;
    opacity: 0.9;
}

.chatbot-close {
    background: none;
    border: none;
    color: white;
    font-size: 1.25rem;
    cursor: pointer;
    padding: 0.25rem;
    border-radius: 50%;
    transition: background 0.2s ease;
}

.chatbot-close:hover {
    background: rgba(255,255,255,0.2);
}

.chatbot-body {
    flex: 1;
    padding: 1.25rem;
    overflow-y: auto;
    background: var(--bg-secondary);
}

.chat-message {
    margin-bottom: 1rem;
    display: flex;
    align-items: flex-end;
    gap: 0.5rem;
}

.chat-message.user {
    flex-direction: row-reverse;
}

.message-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 0.75rem;
    flex-shrink: 0;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
}

.user-avatar {
    background: var(--primary);
    border-color: var(--primary);
}

.message-content {
    background: var(--card-bg);
    padding: 0.75rem 1rem;
    border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 0;
    max-width: 75%;
    box-shadow: var(--shadow-sm);
    font-size: 0.9rem;
    border: 1px solid var(--border-color);
    color: var(--text-main);
}

.chat-message.user .message-content {
    background: linear-gradient(135deg, var(--primary), var(--primary-glow));
    color: white;
    border: none;
    border-radius: var(--radius-lg) var(--radius-lg) 0 var(--radius-lg);
}

.chatbot-input {
    padding: 1rem;
    border-top: 1px solid var(--border-color);
    background: var(--card-bg);
}

.chat-input-group {
    display: flex;
    gap: 0.5rem;
}

.chat-input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-full);
    font-size: 0.9rem;
    outline: none;
    background: var(--bg-color);
    color: var(--text-main);
    transition: border-color 0.2s ease;
}

.chat-input:focus {
    border-color: var(--primary);
}

.chat-send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease;
}

.chat-send-btn:hover {
    transform: scale(1.05);
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
    .chatbot-container {
        bottom: 1rem;
        right: 1rem;
    }
    
    .chatbot-trigger {
        width: 50px;
        height: 50px;
        font-size: 20px;
    }

    .chatbot-window {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        border: none;
    }

    .chatbot-header {
        border-radius: 0;
        padding: 1rem;
    }
}
</style>

<!-- Floating Chatbot -->
<div class="chatbot-container">
    <div class="chatbot-window" id="chatbotWindow">
        <div class="chatbot-header">
            <div class="chatbot-info">
                <div class="chatbot-avatar">
                    <img src="https://monkedo-static.s3.eu-central-1.amazonaws.com/component-icons/supabase.png" alt="EcoVerse Avatar">
                </div>
                <div>
                    <div class="chatbot-name">EcoVerse AI</div>
                    <div class="chatbot-subtitle">Always here to help</div>
                </div>
            </div>
            <button class="chatbot-close" onclick="toggleChatbot()" aria-label="Close Chat">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="chatbot-body" id="chatbotBody">
            <div class="chat-message">
                <div class="message-avatar">
                    <img src="https://monkedo-static.s3.eu-central-1.amazonaws.com/component-icons/supabase.png" style="width: 20px; height: 20px;">
                </div>
                <div class="message-content">
                    Hi! I'm your EcoVerse assistant. How can I help you be more green today?
                </div>
            </div>
        </div>
        <div class="chatbot-input">
            <div class="chat-input-group">
                <input type="text" class="chat-input" id="chatInput" placeholder="Type a message...">
                <button class="chat-send-btn" onclick="sendMessage()" aria-label="Send Message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
    <button class="chatbot-trigger" type="button" aria-label="Open Chatbot" onclick="toggleChatbot()">
        <i class="fas fa-comment-dots"></i>
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    function toggleChatbot() {
        const win = document.getElementById('chatbotWindow');
        win.classList.toggle('show');
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const body = document.getElementById('chatbotBody');
        const msg = input.value.trim();

        if (!msg) return;

        // User message
        const uMsg = document.createElement('div');
        uMsg.className = 'chat-message user fade-in';
        uMsg.innerHTML = `
            <div class="message-avatar user-avatar"><i class="fas fa-user"></i></div>
            <div class="message-content">${msg}</div>
        `;
        body.appendChild(uMsg);
        input.value = '';
        body.scrollTop = body.scrollHeight;

        // Loading message
        const lMsg = document.createElement('div');
        lMsg.className = 'chat-message fade-in';
        lMsg.innerHTML = `
            <div class="message-avatar"><i class="fas fa-circle-notch fa-spin"></i></div>
            <div class="message-content">Thinking...</div>
        `;
        body.appendChild(lMsg);
        body.scrollTop = body.scrollHeight;

        fetch('/chatbot-response/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ message: msg })
        })
        .then(res => res.json())
        .then(data => {
            body.removeChild(lMsg);
            const bMsg = document.createElement('div');
            bMsg.className = 'chat-message fade-in';
            bMsg.innerHTML = `
                <div class="message-avatar">
                    <img src="https://monkedo-static.s3.eu-central-1.amazonaws.com/component-icons/supabase.png" style="width: 20px; height: 20px;">
                </div>
                <div class="message-content">${data.response}</div>
            `;
            body.appendChild(bMsg);
            body.scrollTop = body.scrollHeight;
        })
        .catch(err => {
            body.removeChild(lMsg);
            console.error('Error:', err);
        });
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const trimmed = cookie.trim();
                if (trimmed.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(trimmed.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.getElementById('chatInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
